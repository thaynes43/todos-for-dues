name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  release:
    types: [published]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.21.0"

jobs:
  lint-and-typecheck:
    # Run on PRs + push to main. Skip on tag pushes and release events
    # (build-image runs there; lint/test already ran on the same commit
    # via the merge that produced the tag).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TEMP(agent/modernization-p1): surface failure tail as annotation.
      - name: pnpm test
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm test 2>&1 | tee /tmp/test-out.log; then
            tail=$(grep -aE "FAIL|✖|Error|AssertionError|expected|ELIFECYCLE|toomanyrequests|pull|Command failed" /tmp/test-out.log | tail -60 | head -c 3500)
            tail="${tail//'%'/%25}"; tail="${tail//$'\n'/%0A}"; tail="${tail//$'\r'/%0D}"
            echo "::error title=pnpm test failure tail::${tail}"
            exit 1
          fi

  build-image:
    # Hybrid trigger: fires on both `release.published` AND tag pushes.
    # Why both:
    # - `release.published` is the "ideal" automated path post-PLAN-013, BUT
    #   release-please's GITHUB_TOKEN-created Releases do NOT fire downstream
    #   workflows (same GHA security limitation as GITHUB_TOKEN tag pushes).
    #   Verified 2026-05-17 on v0.7.0: release was published at 00:07Z, no
    #   build-image run fired with event=release for 15+ min.
    # - `push: tags` restores the manual-user-context tag re-push escape
    #   hatch as a fallback.
    # - Re-publishing the release from user context via `gh release create`
    #   DOES fire release.published (worked for v0.7.0 recovery).
    # Long-term proper fix: mint a fine-grained PAT for release-please so
    # release-please's actions originate from a real user identity. Tracked
    # as PLAN-013 §3.1 #9 PAT follow-up.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # `github.event.release.tag_name` for release events; `github.ref_name`
          # for tag pushes (e.g. "v0.7.0").
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thaynes43/todos-for-dues
          tags: |
            type=raw,value=${{ github.event.release.tag_name || github.ref_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
