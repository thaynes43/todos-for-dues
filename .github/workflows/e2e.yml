name: e2e

# Advisory CI. Skip on docs-only / agent-prompt / changelog changes —
# Playwright covers UI + tRPC integration paths; none of those move when
# only Markdown / .agents/ scaffolding changes. ~10 min runner-time saved
# per docs PR.
#
# `lint-and-typecheck` + `test` in ci.yml still run on docs PRs (they're
# required-status-checks and only ~2 min); structurally cheaper to keep
# those always-on than to add the conditional-job pattern. If that 2 min
# becomes an issue, revisit with dorny/paths-filter or equivalent.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - 'CHANGELOG.md'
      - '*.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - 'CHANGELOG.md'
      - '*.md'
      - 'LICENSE'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.21.0"

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm --filter web exec playwright install --with-deps chromium

      # Non-chapter-state suites share a globalSetup → single testcontainer
      # DB: walking-skeleton / e2e/auth (portal SSO + claim re-sync, ADR-013)
      # / mvp / admin collapse into one invocation here. Cross-suite seed
      # safety relies on UUID-suffixed personas + UUID-self-filter assertions
      # (per PLAN-013 §3.1 #2). The portal-shaped OIDC mock keys identities
      # by email, so parallel workers never race a shared profile slot.
      # Failure tail → check-run annotation (see ci.yml `pnpm test` note:
      # operator pods can read annotations but not Actions log blobs).
      - name: e2e — main (collapsed walking-skeleton + auth + mvp + admin)
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm --filter web e2e e2e/walking-skeleton/ e2e/walking-skeleton.spec.ts e2e/auth/portal-sso.spec.ts e2e/auth/claim-resync.spec.ts e2e/auth/member-status-signin.spec.ts e2e/mvp/ e2e/admin/ 2>&1 | tee /tmp/e2e.log; then
            tail=$(grep -aE "✘|[0-9]+\) \[chromium\]|Error|Timeout|timed out|toomanyrequests|failed|passed" /tmp/e2e.log | tail -60 | head -c 3500)
            tail="${tail//'%'/%25}"; tail="${tail//$'\n'/%0A}"; tail="${tail//$'\r'/%0D}"
            echo "::error title=e2e main failure tail::${tail}"
            # Operator pods can read check-run annotations but not Actions log
            # blobs — surface the first failure's page snapshot (error-context)
            # too, so failures are diagnosable from the annotation alone.
            ctx_file=$(find apps/web/test-results -name 'error-context.md' 2>/dev/null | sort | head -1)
            if [ -n "$ctx_file" ]; then
              ctx=$(head -c 3500 "$ctx_file")
              ctx="${ctx//'%'/%25}"; ctx="${ctx//$'\n'/%0A}"; ctx="${ctx//$'\r'/%0D}"
              echo "::error title=e2e first error-context (${ctx_file})::${ctx}"
            fi
            exit 1
          fi

      # ADR-015 orthogonality refactor removed the in-app role-mutation specs
      # (admin-grant / admin-demote-admin / self-service / admin-swap /
      # last-admin-blocked) — role changes now happen at the portal, not in the
      # app. The remaining chapter-safe roles specs seed only their own
      # UUID-suffixed personas and never demote admins, so they collapse into
      # one invocation.
      - name: e2e — roles (chapter-safe set, single invocation)
        run: |
          .github/scripts/e2e-annotated.sh "roles chapter-safe" \
            e2e/roles/admin-users-list.spec.ts \
            e2e/roles/role-history.spec.ts \
            e2e/roles/member-status.spec.ts

      # ADR-013 min-Admin claim-sync guard: depends on chapter-wide
      # count(Admin) = 1 at sign-in time (achieved by demoting the
      # globally-seeded Bootstrap Admin via the scope-narrowed helper +
      # `fetchBootstrapAdminIds`), and racing walking-skeleton's BOOTSTRAP_ADMIN
      # signin path, so it needs its own Playwright invocation / fresh DB.
      - name: e2e — auth min-admin-guard (own invocation)
        run: .github/scripts/e2e-annotated.sh "min-admin-guard" e2e/auth/min-admin-guard.spec.ts

  # ADR-014 member-status validation specs (PR #58): the heaviest
  # sign-in/navigation profile in the suite (~15 OAuth sign-ins, repeated
  # /profile + job-page loads). Adding them to EITHER established invocation
  # blew its load envelope on GHA — run 31828264411 (added to main: unrelated
  # mvp/admin specs flaked on 30s waits) and run 31829302501 (added to roles:
  # that step went red) — so they run as their OWN JOB on a separate runner,
  # keeping the `playwright` job's workload byte-identical to main's. Fresh
  # testcontainer + dev server; no chapter-state dependency: both specs seed
  # only UUID-suffixed personas and never demote admins.
  member-status-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: e2e — member-status validation (own runner)
        run: |
          .github/scripts/e2e-annotated.sh "member-status validation" \
            e2e/roles/member-status-flip-cycles.spec.ts \
            e2e/auth/member-status-roundtrip.spec.ts
