name: e2e

# Advisory CI. Skip on docs-only / agent-prompt / changelog changes —
# Playwright covers UI + tRPC integration paths; none of those move when
# only Markdown / .agents/ scaffolding changes. ~10 min runner-time saved
# per docs PR.
#
# `lint-and-typecheck` + `test` in ci.yml still run on docs PRs (they're
# required-status-checks and only ~2 min); structurally cheaper to keep
# those always-on than to add the conditional-job pattern. If that 2 min
# becomes an issue, revisit with dorny/paths-filter or equivalent.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - 'CHANGELOG.md'
      - '*.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - 'CHANGELOG.md'
      - '*.md'
      - 'LICENSE'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.21.0"

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm --filter web exec playwright install --with-deps chromium

      # Non-chapter-state suites share a globalSetup → single testcontainer
      # DB: walking-skeleton / e2e/auth (portal SSO + claim re-sync, ADR-013)
      # / mvp / admin collapse into one invocation here. Cross-suite seed
      # safety relies on UUID-suffixed personas + UUID-self-filter assertions
      # (per PLAN-013 §3.1 #2). The portal-shaped OIDC mock keys identities
      # by email, so parallel workers never race a shared profile slot.
      # Failure tail → check-run annotation (see ci.yml `pnpm test` note:
      # operator pods can read annotations but not Actions log blobs).
      - name: e2e — main (collapsed walking-skeleton + auth + mvp + admin)
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm --filter web e2e e2e/walking-skeleton/ e2e/walking-skeleton.spec.ts e2e/auth/portal-sso.spec.ts e2e/auth/claim-resync.spec.ts e2e/auth/member-status-signin.spec.ts e2e/mvp/ e2e/admin/ 2>&1 | tee /tmp/e2e.log; then
            tail=$(grep -aE "✘|[0-9]+\) \[chromium\]|Error|Timeout|timed out|toomanyrequests|failed|passed" /tmp/e2e.log | tail -60 | head -c 3500)
            tail="${tail//'%'/%25}"; tail="${tail//$'\n'/%0A}"; tail="${tail//$'\r'/%0D}"
            echo "::error title=e2e main failure tail::${tail}"
            # Operator pods can read check-run annotations but not Actions log
            # blobs — surface the first failure's page snapshot (error-context)
            # too, so failures are diagnosable from the annotation alone.
            ctx_file=$(find apps/web/test-results -name 'error-context.md' 2>/dev/null | sort | head -1)
            if [ -n "$ctx_file" ]; then
              ctx=$(head -c 3500 "$ctx_file")
              ctx="${ctx//'%'/%25}"; ctx="${ctx//$'\n'/%0A}"; ctx="${ctx//$'\r'/%0D}"
              echo "::error title=e2e first error-context (${ctx_file})::${ctx}"
            fi
            exit 1
          fi

      # PLAN-013 §3.1 #1: `demoteAllOtherAdmins` is now scope-narrowed to a
      # per-spec ID allowlist, so the 7 chapter-safe roles specs (admin-grant,
      # admin-demote-admin, admin-users-list, role-history, self-service,
      # member-status, member-status-flip-cycles) no longer race each other's
      # seeded admins. Collapse them into one invocation.
      - name: e2e — roles (chapter-safe set, single invocation)
        run: |
          pnpm --filter web e2e \
            e2e/roles/admin-grant.spec.ts \
            e2e/roles/admin-demote-admin.spec.ts \
            e2e/roles/admin-users-list.spec.ts \
            e2e/roles/role-history.spec.ts \
            e2e/roles/self-service.spec.ts \
            e2e/roles/member-status.spec.ts \
            e2e/roles/member-status-flip-cycles.spec.ts

      # `last-admin-blocked` + `admin-swap` each need their OWN Playwright
      # invocation (fresh testcontainer DB). Both depend on chapter-wide
      # count(Admin) = 1 at the moment of self-demote — achieved by demoting
      # the globally-seeded Bootstrap Admin via the scope-narrowed helper +
      # `fetchBootstrapAdminIds`. Sharing a DB across these two specs would
      # leave each prior spec's `cast.admin` lingering as Admin (no spec
      # demotes another spec's seeded admin post scope-narrow), pushing
      # count(Admin) ≥ 2 by the second spec's run. Sharing a DB with any
      # other suite would also race walking-skeleton's BOOTSTRAP_ADMIN
      # signin path. Per-spec isolation is the only safe option until the
      # min-Admin trigger is made chapter-scoped (out of scope here).
      - name: e2e — roles last-admin-blocked (own invocation)
        run: pnpm --filter web e2e e2e/roles/last-admin-blocked.spec.ts

      - name: e2e — roles admin-swap (own invocation)
        run: pnpm --filter web e2e e2e/roles/admin-swap.spec.ts

      # ADR-013 min-Admin claim-sync guard: same chapter-wide count(Admin)=1
      # dependency as last-admin-blocked → own invocation / fresh DB.
      - name: e2e — auth min-admin-guard (own invocation)
        run: pnpm --filter web e2e e2e/auth/min-admin-guard.spec.ts

      # ADR-014 validation round-trips: ~10 full OAuth sign-ins + repeated
      # /profile loads across two tests — too sign-in-heavy for the collapsed
      # main invocation's load envelope (adding it there starved the shared
      # dev server on GHA and flaked unrelated specs' 30s waits — PR #58 run
      # 31828264411). Own invocation = fresh testcontainer + dev server, same
      # isolation pattern as last-admin-blocked / admin-swap above. No
      # chapter-state dependency: it seeds only UUID-suffixed personas.
      - name: e2e — auth member-status-roundtrip (own invocation)
        run: pnpm --filter web e2e e2e/auth/member-status-roundtrip.spec.ts
