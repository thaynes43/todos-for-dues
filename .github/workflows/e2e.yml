name: e2e

# Advisory CI. Skip on docs-only / agent-prompt / changelog changes —
# Playwright covers UI + tRPC integration paths; none of those move when
# only Markdown / .agents/ scaffolding changes. ~10 min runner-time saved
# per docs PR.
#
# `lint-and-typecheck` + `test` in ci.yml still run on docs PRs (they're
# required-status-checks and only ~2 min); structurally cheaper to keep
# those always-on than to add the conditional-job pattern. If that 2 min
# becomes an issue, revisit with dorny/paths-filter or equivalent.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - 'CHANGELOG.md'
      - '*.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - 'CHANGELOG.md'
      - '*.md'
      - 'LICENSE'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.1.2"

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm --filter web exec playwright install --with-deps chromium

      # Suite isolation: each suite runs in its own Playwright invocation
      # (fresh globalSetup → fresh testcontainer DB) so cross-suite state
      # pollution doesn't surface here.
      #
      # PLAN-013 §3.1 #1 + #2 fixes shipped in this PR
      # (`demoteAllOtherAdmins` scope-narrow + `invites.spec.ts` self-filter
      # by minted UUID) closed the originally-named offenders, but local 3×
      # verification under partial-collapse + full-collapse shapes still
      # surfaced flake in `admin/dispute-resolve-*.spec.ts`,
      # `admin/layout-shell.spec.ts`, and `mvp/revert-completion.spec.ts` —
      # all timing out in `signInAs`'s `waitForURL('**/')` post-redirect, a
      # pre-existing test-infra glob mismatch masked by per-suite isolation.
      # PLAN-013 §3.1 #3 (parallel-vs-serial admin comparison) remains open;
      # workflow collapse deferred until the signInAs glob is fixed.

      - name: e2e — walking-skeleton (PLAN-006 per-page + PLAN-008 chained)
        run: pnpm --filter web e2e -- e2e/walking-skeleton/ e2e/walking-skeleton.spec.ts

      - name: e2e — SSO / auth (PLAN-008)
        run: pnpm --filter web e2e -- __e2e__/auth/

      - name: e2e — mvp (PLAN-010)
        run: pnpm --filter web e2e -- e2e/mvp/

      - name: e2e — admin (PLAN-011 + PLAN-014 invites)
        run: pnpm --filter web e2e -- e2e/admin/

      # PLAN-013 §3.1 #1: `demoteAllOtherAdmins` is now scope-narrowed to a
      # per-spec ID allowlist, so the 5 chapter-safe roles specs (admin-grant,
      # admin-demote-admin, admin-users-list, role-history, self-service) no
      # longer race each other's seeded admins. Collapse them into one
      # invocation.
      - name: e2e — roles (chapter-safe set, single invocation)
        run: |
          pnpm --filter web e2e -- \
            e2e/roles/admin-grant.spec.ts \
            e2e/roles/admin-demote-admin.spec.ts \
            e2e/roles/admin-users-list.spec.ts \
            e2e/roles/role-history.spec.ts \
            e2e/roles/self-service.spec.ts

      # `last-admin-blocked` + `admin-swap` each need their OWN Playwright
      # invocation (fresh testcontainer DB). Both depend on chapter-wide
      # count(Admin) = 1 at the moment of self-demote — achieved by demoting
      # the globally-seeded Bootstrap Admin via the scope-narrowed helper +
      # `fetchBootstrapAdminIds`. Sharing a DB across these two specs would
      # leave each prior spec's `cast.admin` lingering as Admin (no spec
      # demotes another spec's seeded admin post scope-narrow), pushing
      # count(Admin) ≥ 2 by the second spec's run. Sharing a DB with any
      # other suite would also race walking-skeleton's BOOTSTRAP_ADMIN
      # signin path. Per-spec isolation is the only safe option until the
      # min-Admin trigger is made chapter-scoped (out of scope here).
      - name: e2e — roles last-admin-blocked (own invocation)
        run: pnpm --filter web e2e -- e2e/roles/last-admin-blocked.spec.ts

      - name: e2e — roles admin-swap (own invocation)
        run: pnpm --filter web e2e -- e2e/roles/admin-swap.spec.ts
